name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elena-belyasnik/vpe04-test-github-actions-docker-gitflow

jobs:
  # ===================== ДЖОБА 1: СБОРКА И ПУШ В GHCR =====================
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ===================== ДЖОБА 2: РАЗВЁРТЫВАНИЕ НА СЕРВЕРЕ =====================
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Логинимся в GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Определяем тег образа (берём SHA коммита)
            IMAGE_TAG="ghcr.io/elena-belyasnik/vpe04-test-github-actions-docker-gitflow:${{ github.sha }}"
            LATEST_TAG="ghcr.io/elena-belyasnik/vpe04-test-github-actions-docker-gitflow:latest"

            # Скачиваем свежий образ
            docker pull $IMAGE_TAG

            # Разворачиваем новый контейнер
            # Останавливаем и удаляем старый, если есть
            docker stop fastapi-app || true
            docker rm fastapi-app || true

            # Запускаем новый контейнер
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              $IMAGE_TAG

            # Удаляем старые образы (чистим диск)
            docker image prune -f
